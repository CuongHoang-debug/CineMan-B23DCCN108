{% extends 'base.html' %}
{% block title %}Đăng nhập - CineMan{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-film text-danger fa-3x mb-2"></i>
                <h3 class="fw-bold">CineMan</h3>
                <p class="text-secondary small">Hệ thống Quản lý Rạp Chiếu Phim</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label text-light">Tài khoản / SĐT / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="taiKhoan" id="inputUser" class="form-control bg-dark border-secondary text-light" placeholder="Nhập tài khoản" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="matKhau" id="inputPass" class="form-control bg-dark border-secondary text-light" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-cineman w-100 py-2 mt-2">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng nhập
                </button>
            </form>

            <div class="mt-4 pt-3 border-top border-secondary">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-secondary small">Chưa có thẻ thành viên?</span>
                    <a href="{{ url_for('register') }}" class="text-info small text-decoration-none">Đăng ký ngay</a>
                </div>

                <div class="alert alert-dark p-2 mt-3 small border-secondary">
                    <strong class="text-warning d-block mb-1"><i class="fa-solid fa-bolt me-1"></i> Chọn nhanh tài khoản demo:</strong>
                    <div class="d-grid gap-1">
                        <button type="button" class="btn btn-outline-warning btn-sm text-start" onclick="fillLogin('admin', 'admin123')">
                            <i class="fa-solid fa-user-shield me-1"></i> <strong>Quản lý:</strong> admin / admin123
                        </button>
                        <button type="button" class="btn btn-outline-info btn-sm text-start" onclick="fillLogin('staff', 'staff123')">
                            <i class="fa-solid fa-cash-register me-1"></i> <strong>Bán hàng (POS):</strong> staff / staff123
                        </button>
                        <button type="button" class="btn btn-outline-light btn-sm text-start" onclick="fillLogin('customer', 'customer123')">
                            <i class="fa-solid fa-user me-1"></i> <strong>Khách hàng:</strong> customer / customer123
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillLogin(u, p) {
    document.getElementById('inputUser').value = u;
    document.getElementById('inputPass').value = p;
}
</script>
{% endblock %}
